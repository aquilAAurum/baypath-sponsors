<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6f62">
<meta name="mobile-web-app-capable" content="yes">
<title>Baypath Sponsors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Standalone build: no Obsidian, no Claude. Reads the vault's .md notes from a local folder, a GitHub repository, or Google Drive. */
:root {
	--bg: #f6f8f7; --surface: #ffffff; --sunk: #eaefed; --line: #d9e1de; --fg: #18211f; --muted: #5b6965; --faint: #8a9894;
	--accent: #0e6f62; --accent-soft: #d6ece7; --on-accent: #ffffff; --good: #2f8a4a; --warn: #b5650d; --warn-soft: #f7e7d3;
	--bad: #c0392b; --current: #2d5fb8; --lapsed: #7a4bb5;
	--font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
	--font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root { --bg: #111816; --surface: #18211e; --sunk: #1f2a27; --line: #2c3a36; --fg: #e6eeeb; --muted: #a2b3ae; --faint: #6f817c;
		--accent: #4cc0ad; --accent-soft: #173a34; --on-accent: #06211c; --good: #5ec27a; --warn: #e6a456; --warn-soft: #3a2a14;
		--bad: #ef7466; --current: #79a4f0; --lapsed: #b892ec; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 19px; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--faint); vertical-align: 1px; }
.sync.ok .dot { background: var(--good); } .sync.busy .dot { background: var(--warn); } .sync.err .dot { background: var(--bad); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
main { padding-block: 14px 110px; }
section + section { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sec-head h2 { font-size: 17px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.step { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-width: 74px; text-align: left; }
.step b { display: block; font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.step span { font-size: 12px; color: var(--muted); }
.step.zero b { color: var(--faint); } .step.on { border-color: var(--accent); background: var(--accent-soft); }
.note { border-radius: var(--r); padding: 10px 12px; font-size: 14px; }
.note.warn { background: var(--warn-soft); } .note.info { background: var(--sunk); }
.note + .note { margin-top: 6px; }
.balance { font-size: 13px; color: var(--muted); margin: 6px 0 2px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; cursor: pointer; }
.list > li:last-child .row { border-bottom: 0; }
.row-top { display: flex; align-items: baseline; gap: 8px; }
.row-name { font-weight: 600; flex: 1; min-width: 0; }
.row-score { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-next { font-size: 14px; margin-top: 4px; }
.row-next b { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); white-space: nowrap; }
.chip.current { color: var(--current); border-color: var(--current); } .chip.lapsed { color: var(--lapsed); border-color: var(--lapsed); }
.chip.due { color: var(--bad); border-color: var(--bad); }
.focus { counter-reset: f; }
.focus .row { padding-left: 42px; position: relative; }
.focus .row::before { counter-increment: f; content: counter(f); position: absolute; left: 14px; top: 12px; font-family: var(--font-display); font-weight: 700; color: var(--faint); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 14px; min-height: 36px; text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.meter { display: inline-grid; grid-template-columns: repeat(4, 10px); gap: 2px; vertical-align: middle; margin-left: 6px; }
.meter i { height: 12px; border-radius: 2px; background: var(--sunk); position: relative; overflow: hidden; }
.meter i::after { content: ""; position: absolute; inset: auto 0 0 0; height: var(--h); background: var(--accent); }
.filters { display: grid; gap: 8px; margin-bottom: 10px; }
.filters .line { display: flex; gap: 8px; flex-wrap: wrap; }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 40px; min-width: 0; width: 100%; }
.filters select { flex: 1 1 140px; width: auto; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 0 10px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); font-weight: 600; }
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 2; }
.sheet-head .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.sheet-head h2 { font-size: 19px; flex: 1; min-width: 0; }
.sheet-body { padding-block: 14px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.sheet-body > * { min-width: 0; }
.block h3 { font-size: 15px; margin-bottom: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.next-big { font-size: 16px; }
.stage-pick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.stage-pick::-webkit-scrollbar { display: none; }
.stage-pick button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.stage-pick button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.form { display: grid; gap: 8px; }
.form label { font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
textarea.field { min-height: 70px; resize: vertical; }
.pillar { display: grid; grid-template-columns: 112px 1fr 40px; align-items: center; gap: 2px 10px; }
.pillar + .pillar { margin-top: 10px; }
.bar { height: 7px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.pillar .why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
dl.facts { display: grid; grid-template-columns: minmax(96px, max-content) 1fr; gap: 6px 14px; margin: 0; }
dl.facts dt { color: var(--muted); font-size: 13px; }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.people li:last-child { border-bottom: 0; }
.copy { font-size: 13px; color: var(--muted); user-select: all; }
details > summary { cursor: pointer; font-weight: 600; font-family: var(--font-display); }
details[open] > summary { margin-bottom: 10px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
table.t td.r { text-align: right; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty h2 { color: var(--fg); font-size: 18px; margin-bottom: 6px; }
.connect { display: grid; gap: 14px; }
.connect .panel h3 { font-size: 16px; margin-bottom: 4px; }
.connect .panel p { margin: 0 0 10px; }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.hint { font-size: 12.5px; color: var(--muted); }
code { font-size: 12.5px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
	<div class="brand"><h1>Baypath Sponsors</h1><div id="sync" class="sync"><span class="dot"></span>Not connected</div></div>
	<button class="iconbtn" id="refresh" aria-label="Refresh from notes" title="Re-read the notes folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
</div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
	<button class="tab" data-go="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Focus</button>
	<button class="tab" data-go="pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>Pipeline</button>
	<button class="tab" data-go="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c-.5-2.6-2-4.3-4-5"/></svg>People</button>
	<button class="tab" data-go="balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M5 7h14M5 7l-3 7h6zM19 7l-3 7h6z"/></svg>Balance</button>
</div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="dirpick" webkitdirectory directory multiple hidden>

<script>
'use strict';
/* ================================================================
 * Settings and storage
 * ================================================================ */
const DEFAULTS = {
	googleClientId: '',
	ghRepo: '', ghBranch: '',
	homeState: 'MA',
	localTowns: 'Hopkinton, Milford, Ashland, Holliston, Southborough, Westborough, Upton, Framingham, Natick, Hudson, Marlborough, Medway, Franklin, Grafton, Northborough, Sherborn, Mendon, Bellingham, Wellesley, Shrewsbury, Sudbury, Westwood, Worcester',
	focusSize: 8, maxCurrentShare: 0.2, maxPerNetwork: 2, currentDamping: 0.5, askCooldownMonths: 11
};
const store = {
	get(k, d) { try { const v = localStorage.getItem('bsfx.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
	set(k, v) { try { localStorage.setItem('bsfx.' + k, JSON.stringify(v)); } catch (e) { /* full or blocked */ } }
};
let cfg = Object.assign({}, DEFAULTS, store.get('cfg', {}));
// cache: { source: {kind, label, rootId?, orgId?, peopleId?}, readAt, orgs: {key: rec}, people: {key: rec} }
// rec: { key, title, fm, modified, link }
let cache = store.get('cache', { source: null, readAt: null, orgs: {}, people: {} });

/* IndexedDB keeps the local folder handle so "Refresh" works without re-picking. */
const idb = {
	open() { return new Promise((res, rej) => { const r = indexedDB.open('baypath-sponsors', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
	async get(k) { try { const db = await idb.open(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
	async set(k, v) { try { const db = await idb.open(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* ignore */ } },
	async del(k) { try { const db = await idb.open(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* ignore */ } }
};

/* ================================================================
 * Helpers
 * ================================================================ */
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function str(v) { if (v === null || v === undefined) return ''; if (Array.isArray(v)) return v.map(str).filter(Boolean).join(', '); return String(v).trim(); }
function arr(v) { if (v === null || v === undefined || v === '') return []; return (Array.isArray(v) ? v : [v]).map(str).filter(Boolean); }
function yn(v) { const s = str(v).toLowerCase(); return s === 'true' ? 'yes' : s === 'false' ? 'no' : s; }
const pad = (n) => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addMonths(s, n) { const d = parseYmd(s); d.setMonth(d.getMonth() + n); return ymd(d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysFromToday(s) { if (!isDate(s)) return null; return Math.round((parseYmd(s) - parseYmd(today())) / 86400000); }
const pct = (n) => Math.round(n * 100) + '%';
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
function ago(iso) { if (!iso) return 'never'; const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; return Math.round(h / 24) + ' d ago'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2800); }

/* ================================================================
 * Frontmatter: a small YAML reader/writer for the CRM schema
 * (key: value, quoted strings, block and inline lists, one nested map)
 * ================================================================ */
function splitFlow(s) { const out = []; let cur = '', q = null; for (const ch of s) { if (q) { cur += ch; if (ch === q) q = null; } else if (ch === '"' || ch === "'") { q = ch; cur += ch; } else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } if (cur.trim()) out.push(cur); return out; }
function scalar(v) {
	v = String(v).trim();
	if (v === '' || v === '~' || v === 'null') return null;
	if (v[0] === '"') { const end = v.lastIndexOf('"'); try { return JSON.parse(v.slice(0, end + 1)); } catch (e) { return v.slice(1, end > 0 ? end : undefined); } }
	if (v[0] === "'") { const end = v.lastIndexOf("'"); return v.slice(1, end > 0 ? end : undefined).replace(/''/g, "'"); }
	if (v[0] === '[' && v.endsWith(']')) { const inner = v.slice(1, -1).trim(); return inner ? splitFlow(inner).map(scalar).filter((x) => x !== null) : []; }
	return v.replace(/\s+#.*$/, '');
}
function parseYaml(block) {
	const lines = block.split('\n'); const out = {}; let i = 0;
	while (i < lines.length) {
		const line = lines[i];
		if (!line.trim() || /^\s*#/.test(line) || /^\s/.test(line)) { i++; continue; }
		const m = line.match(/^([^:#][^:]*?):(?:[ \t]+(.*)|[ \t]*)$/);
		if (!m) { i++; continue; }
		const key = m[1].trim(); const v = (m[2] || '').trim();
		if (v === '' || v === '|' || v === '>') {
			let j = i + 1; const items = [];
			while (j < lines.length && /^\s*-(\s|$)/.test(lines[j])) { items.push(scalar(lines[j].replace(/^\s*-\s?/, ''))); j++; }
			if (items.length) { out[key] = items.filter((x) => x !== null); i = j; continue; }
			const map = {}; let any = false;
			while (j < lines.length && /^\s+\S/.test(lines[j])) { const mm = lines[j].trim().match(/^([^:]+):\s*(.*)$/); if (mm) { map[mm[1].trim()] = scalar(mm[2]); any = true; } j++; }
			out[key] = any ? map : null; i = j; continue;
		}
		out[key] = scalar(v); i++;
	}
	return out;
}
function splitNote(text) {
	const t = text.replace(/^\uFEFF/, '');
	const nl = t.includes('\r\n') ? '\r\n' : '\n';
	const m = t.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/);
	if (!m) return { nl, yaml: null, body: t };
	return { nl, yaml: m[1].replace(/\r/g, ''), body: t.slice(m[0].length) };
}
function frontmatter(text) { const s = splitNote(text); return s.yaml === null ? {} : parseYaml(s.yaml); }
function yamlScalar(v) {
	if (v === null || v === undefined) return '';
	const s = String(v);
	if (s === '') return '';
	if (isDate(s)) return s;
	if (/^[A-Za-z0-9][\w .,()/&+@'’-]*$/.test(s) && !/: |\s#/.test(s) && !/^(true|false|yes|no|null|on|off|~)$/i.test(s) && !/^[\d.+-]+$/.test(s)) return s;
	return JSON.stringify(s);
}
function setYamlKeys(text, changes) {
	const s = splitNote(text);
	const lines = s.yaml === null ? [] : s.yaml.split('\n');
	for (const [k, v] of Object.entries(changes)) {
		let start = lines.findIndex((l) => l.startsWith(k + ':'));
		let end = start;
		if (start >= 0) { end = start + 1; while (end < lines.length && (/^\s/.test(lines[end]) || /^-(\s|$)/.test(lines[end])) && lines[end].trim() !== '') end++; }
		let rep;
		if (Array.isArray(v)) rep = v.length ? [k + ':'].concat(v.map((x) => '  - ' + (yamlScalar(x) || '""'))) : [k + ': []'];
		else { const sv = yamlScalar(v); rep = [sv === '' ? k + ':' : k + ': ' + sv]; }
		if (start >= 0) lines.splice(start, end - start, ...rep); else lines.push(...rep);
	}
	return '---' + s.nl + lines.join(s.nl) + s.nl + '---' + s.nl + (s.yaml === null ? s.nl : '') + s.body;
}
function appendLog(text, type, msg) {
	const line = '- **' + today() + '** [' + type + ']: ' + String(msg).replace(/\r?\n/g, ' ');
	const nl = text.includes('\r\n') ? '\r\n' : '\n';
	const m = text.match(/^## Interaction Log[ \t]*\r?\n/m);
	if (m) { const at = m.index + m[0].length; return text.slice(0, at) + line + nl + text.slice(at); }
	return text.replace(/\s*$/, '') + nl + nl + '## Interaction Log' + nl + line + nl;
}
function newOrgNote(name) {
	return ['---', 'type: organization', 'name: ' + JSON.stringify(name), 'category: company', 'industry:', 'website:', 'hq:', 'parent_org:', 'relationship:', 'primary_contact:', 'people: []', 'related_orgs: []',
		'baypath_fit: medium', 'giving_programs:', 'giving_url:', 'matching_gifts: unknown', 'matching_gift_details:', 'status:', 'enrichment: partial', 'enriched_on: ' + today(),
		'funnel_stage: identify', 'engagement: none', 'source: phone', 'baypath_history:', 'local_ties: []', 'animal_stake:', 'shelter_program:', 'program_fit:', 'warm_paths: []',
		'ask_type:', 'ask_amount:', 'last_touch:', 'last_ask:', 'last_gift:', 'last_gift_amount:', 'next_step:', 'next_step_date:', 'tags:', '  - sponsor-prospect', '---', '',
		'## Summary', '', '', '## Interaction Log', '- **' + today() + '** [Created]: Added as a prospect from the Baypath Sponsors app.', ''].join('\n');
}

/* ================================================================
 * Source 1: a folder on this device
 *   - Chrome / Edge on a computer: read and write (File System Access API)
 *   - Other browsers: read-only through the folder chooser
 * ================================================================ */
const Local = {
	root: null, orgDir: null, peopleDir: null, files: null, // files: Map key -> File (read-only fallback)
	supported: typeof window.showDirectoryPicker === 'function',
	async findDirs(root) {
		const tryGet = async (d, n) => { try { return await d.getDirectoryHandle(n); } catch (e) { return null; } };
		let net = await tryGet(root, 'Network');
		if (!net && (await tryGet(root, 'Organizations'))) net = root;
		if (!net) throw new Error('That folder has no "Network" folder inside. Pick the Obsidian vault folder (the one that contains Network).');
		const orgs = await tryGet(net, 'Organizations'); const ppl = await tryGet(net, 'People');
		if (!orgs || !ppl) throw new Error('Could not find Network/Organizations and Network/People in that folder.');
		this.root = root; this.orgDir = orgs; this.peopleDir = ppl; this.files = null;
	},
	async pick() {
		const root = await window.showDirectoryPicker({ id: 'baypath-vault', mode: 'readwrite' });
		await this.findDirs(root);
		await idb.set('root', root);
		cache.source = { kind: 'local', label: root.name };
		return true;
	},
	async reconnect(ask) {
		const root = await idb.get('root');
		if (!root) return false;
		let p = await root.queryPermission({ mode: 'readwrite' });
		if (p !== 'granted' && ask) p = await root.requestPermission({ mode: 'readwrite' });
		if (p !== 'granted') return false;
		await this.findDirs(root);
		return true;
	},
	fromFileList(list) {
		const files = new Map(); let rootName = '';
		for (const f of list) {
			const rel = f.webkitRelativePath || f.name; if (!/\.md$/i.test(rel)) continue;
			const parts = rel.split('/'); rootName = rootName || parts[0];
			const dir = parts[parts.length - 2];
			if (dir === 'Organizations' || dir === 'People') files.set(dir + '/' + f.name, f);
		}
		if (!files.size) throw new Error('No notes found. Choose the Obsidian vault folder (the one that contains Network).');
		this.files = files; this.root = null;
		cache.source = { kind: 'local-readonly', label: rootName || 'chosen folder' };
	},
	canWrite() { return Boolean(this.orgDir); },
	async readAll(progress) {
		const out = { orgs: [], people: [] };
		if (this.files) {
			const total = this.files.size; let n = 0;
			for (const [key, f] of this.files) {
				const text = await f.text(); const kind = key.startsWith('Organizations/') ? 'orgs' : 'people';
				out[kind].push({ key, title: f.name.replace(/\.md$/i, ''), fm: frontmatter(text), modified: new Date(f.lastModified).toISOString(), link: '' });
				if (++n % 25 === 0) progress(n, total);
			}
			return out;
		}
		const entries = [];
		for (const [kind, dir, prefix] of [['orgs', this.orgDir, 'Organizations/'], ['people', this.peopleDir, 'People/']]) {
			for await (const [name, h] of dir.entries()) if (h.kind === 'file' && /\.md$/i.test(name)) entries.push([kind, prefix + name, h]);
		}
		let n = 0;
		for (const [kind, key, h] of entries) {
			const f = await h.getFile(); const text = await f.text();
			out[kind].push({ key, title: h.name.replace(/\.md$/i, ''), fm: frontmatter(text), modified: new Date(f.lastModified).toISOString(), link: '' });
			if (++n % 25 === 0) progress(n, entries.length);
		}
		return out;
	},
	async edit(key, fn) {
		const [folder, name] = key.split('/');
		const dir = folder === 'Organizations' ? this.orgDir : this.peopleDir;
		const h = await dir.getFileHandle(name);
		const text = await (await h.getFile()).text();
		const next = fn(text);
		const w = await h.createWritable(); await w.write(next); await w.close();
		const f = await h.getFile();
		return { fm: frontmatter(next), modified: new Date(f.lastModified).toISOString() };
	},
	async create(name, content) {
		const h = await this.orgDir.getFileHandle(name + '.md', { create: true });
		const existing = await (await h.getFile()).text();
		if (existing.trim()) throw new Error('A note named "' + name + '" already exists.');
		const w = await h.createWritable(); await w.write(content); await w.close();
		return { key: 'Organizations/' + name + '.md', modified: new Date().toISOString() };
	}
};

/* ================================================================
 * Source 2: Google Drive (phone or any browser on an https address)
 *   Needs a Google OAuth client ID (see the setup guide). Reads and
 *   edits the same .md files that Google Drive for desktop syncs.
 * ================================================================ */
const Drive = {
	token: null, expires: 0, client: null,
	available() { return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; },
	loadGis() {
		if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
		return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res; s.onerror = () => rej(new Error('Could not load Google sign-in. Check the internet connection.')); document.head.appendChild(s); });
	},
	async signIn(interactive) {
		if (this.token && Date.now() < this.expires - 60000) return this.token;
		if (!cfg.googleClientId) throw new Error('Add your Google OAuth client ID in Settings first.');
		await this.loadGis();
		return new Promise((res, rej) => {
			this.client = google.accounts.oauth2.initTokenClient({
				client_id: cfg.googleClientId, scope: 'https://www.googleapis.com/auth/drive',
				callback: (r) => { if (r.error) return rej(new Error('Google sign-in: ' + r.error)); this.token = r.access_token; this.expires = Date.now() + (Number(r.expires_in) || 3600) * 1000; res(this.token); },
				error_callback: (e) => rej(new Error('Google sign-in was closed or blocked (' + (e && e.type || 'unknown') + '). Allow pop-ups and try again.'))
			});
			this.client.requestAccessToken({ prompt: interactive ? '' : 'none' });
		});
	},
	async api(path, opts) {
		await this.signIn(true);
		const r = await fetch(path.startsWith('http') ? path : 'https://www.googleapis.com/drive/v3/' + path, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + this.token }, (opts && opts.headers) || {}) }));
		if (r.status === 401) { this.token = null; throw new Error('Google sign-in expired. Tap refresh to sign in again.'); }
		if (!r.ok) { let msg = r.status + ''; try { msg = (await r.json()).error.message; } catch (e) { /* keep status */ } throw new Error('Google Drive: ' + msg); }
		return r;
	},
	async list(q, fields) {
		const out = []; let token = '';
		do {
			const r = await this.api('files?' + new URLSearchParams({ q, fields: 'nextPageToken,files(' + fields + ')', pageSize: '1000', pageToken: token, supportsAllDrives: 'true', includeItemsFromAllDrives: 'true' }));
			const j = await r.json(); out.push(...(j.files || [])); token = j.nextPageToken || '';
		} while (token);
		return out;
	},
	async searchFolders(name) {
		const q = "mimeType = 'application/vnd.google-apps.folder' and trashed = false" + (name ? " and name contains '" + name.replace(/'/g, "\\'") + "'" : '');
		return this.list(q, 'id,name,modifiedTime,parents');
	},
	async child(parentId, name) {
		const f = await this.list("'" + parentId + "' in parents and name = '" + name + "' and mimeType = 'application/vnd.google-apps.folder' and trashed = false", 'id,name');
		return f[0] ? f[0].id : null;
	},
	async useRoot(id, label) {
		let net = await this.child(id, 'Network');
		if (!net && (await this.child(id, 'Organizations'))) net = id;
		if (!net) throw new Error('"' + label + '" has no Network folder inside. Pick the Obsidian vault folder.');
		const orgId = await this.child(net, 'Organizations'); const peopleId = await this.child(net, 'People');
		if (!orgId || !peopleId) throw new Error('Could not find Network/Organizations and Network/People.');
		cache.source = { kind: 'drive', label, rootId: id, orgId, peopleId };
		cache.orgs = {}; cache.people = {};
	},
	async readAll(progress) {
		const src = cache.source; const out = { orgs: [], people: [] };
		const listed = [];
		for (const [kind, folder] of [['orgs', src.orgId], ['people', src.peopleId]]) {
			const files = await this.list("'" + folder + "' in parents and trashed = false and name contains '.md'", 'id,name,modifiedTime,webViewLink');
			files.filter((f) => /\.md$/i.test(f.name)).forEach((f) => listed.push([kind, f]));
		}
		// Only download notes that changed since the last read.
		const todo = []; let n = 0;
		for (const [kind, f] of listed) {
			const prev = cache[kind][f.id];
			if (prev && prev.modified === f.modifiedTime) out[kind].push(prev);
			else todo.push([kind, f]);
		}
		const total = todo.length; progress(0, total);
		const worker = async () => {
			while (todo.length) {
				const [kind, f] = todo.shift();
				const text = await (await this.api('files/' + f.id + '?alt=media&supportsAllDrives=true')).text();
				out[kind].push({ key: f.id, title: f.name.replace(/\.md$/i, ''), fm: frontmatter(text), modified: f.modifiedTime, link: f.webViewLink || '' });
				n++; if (n % 10 === 0 || n === total) progress(n, total);
			}
		};
		await Promise.all(Array.from({ length: 8 }, worker));
		return out;
	},
	canWrite() { return Boolean(cache.source && cache.source.kind === 'drive'); },
	async edit(id, fn) {
		const meta = await (await this.api('files/' + id + '?fields=modifiedTime&supportsAllDrives=true')).json();
		const text = await (await this.api('files/' + id + '?alt=media&supportsAllDrives=true')).text();
		const next = fn(text);
		const r = await this.api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media&fields=id,modifiedTime&supportsAllDrives=true', { method: 'PATCH', headers: { 'Content-Type': 'text/markdown; charset=UTF-8' }, body: next });
		const j = await r.json();
		return { fm: frontmatter(next), modified: j.modifiedTime || meta.modifiedTime };
	},
	async create(name, content) {
		const exists = await this.list("'" + cache.source.orgId + "' in parents and name = '" + (name + '.md').replace(/'/g, "\\'") + "' and trashed = false", 'id');
		if (exists.length) throw new Error('A note named "' + name + '" already exists.');
		const boundary = 'b' + Math.random().toString(36).slice(2);
		const body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: name + '.md', parents: [cache.source.orgId], mimeType: 'text/markdown' }) + '\r\n--' + boundary + '\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n' + content + '\r\n--' + boundary + '--';
		const r = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime,webViewLink&supportsAllDrives=true', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body });
		const j = await r.json();
		return { key: j.id, modified: j.modifiedTime, link: j.webViewLink || '' };
	}
};

/* ================================================================
 * Source 3: a GitHub repository (any device, no Google sign-in)
 *   Reads and edits the .md files through the GitHub API with a
 *   fine-grained access token saved in this browser only. Keep the
 *   notes in a PRIVATE repository: they hold contact details.
 * ================================================================ */
function b64enc(s) { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(s) { const bin = atob(String(s).replace(/\s/g, '')); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
const GitHub = {
	token() { return store.get('ghToken', ''); },
	repoName() {
		const m = String(cfg.ghRepo || '').trim().replace(/\.git$/i, '').replace(/\/+$/, '').match(/(?:github\.com\/)?([\w.-]+)\/([\w.-]+)$/i);
		if (!m) throw new Error('Add the notes repository in Settings, as owner/name (for example aquilAAurum/baypath-notes).');
		return m[1] + '/' + m[2];
	},
	async api(path, opts) {
		const t = this.token();
		if (!t) throw new Error('Add a GitHub access token in Settings first.');
		const r = await fetch('https://api.github.com/' + path, Object.assign({ cache: 'no-store' }, opts, { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } }));
		if (r.ok) return r.json();
		let msg = String(r.status); try { msg = (await r.json()).message || msg; } catch (e) { /* keep status */ }
		const err = new Error(
			r.status === 401 ? 'GitHub rejected the access token. It may have expired: make a new one and paste it in Settings.' :
			r.status === 404 ? 'GitHub: not found. Check the repository name, and that the token was given access to that repository.' :
			r.status === 409 ? 'This note changed somewhere else at the same time. Tap refresh, then try again.' :
			r.status === 403 && /rate limit/i.test(msg) ? 'GitHub is limiting requests. Wait a few minutes and try again.' :
			r.status === 403 ? 'GitHub: ' + msg + ' (the token needs Contents: Read and write on the notes repository).' :
			'GitHub: ' + msg);
		err.status = r.status; throw err;
	},
	async tree(repo, branch) {
		const t = await this.api('repos/' + repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1');
		if (t.truncated) throw new Error('The repository is too large to list. Keep the notes in their own repository.');
		return t.tree || [];
	},
	async connect() {
		const repo = this.repoName();
		const info = await this.api('repos/' + repo);
		if (!info.private && !confirm('"' + repo + '" is a PUBLIC repository: anyone on the internet can read every note in it, including names, emails and phone numbers. Connect anyway?')) return false;
		const branch = String(cfg.ghBranch || '').trim() || info.default_branch;
		const tree = await this.tree(repo, branch);
		const dirs = new Set(tree.filter((e) => e.type === 'tree').map((e) => e.path));
		// The folder holding Organizations and People: prefer one named Network, then the shallowest.
		const bases = Array.from(dirs).filter((p) => /(^|\/)Organizations$/.test(p)).map((p) => p.slice(0, -'Organizations'.length)).filter((b) => dirs.has(b + 'People'))
			.sort((a, b) => (/(^|\/)Network\/$/.test(b) - /(^|\/)Network\/$/.test(a)) || a.length - b.length);
		if (!bases.length) throw new Error('No Organizations and People folders found in ' + repo + '. Upload the vault’s Network folder (with Organizations and People inside) to the repository.');
		cache.source = { kind: 'github', label: repo + (branch !== info.default_branch ? ' · ' + branch : ''), repo, branch, base: bases[0] };
		cache.orgs = {}; cache.people = {};
		return true;
	},
	link(rel) { const s = cache.source; return 'https://github.com/' + s.repo + '/blob/' + encodeURIComponent(s.branch) + '/' + encPath(s.base + rel); },
	contents(rel) { const s = cache.source; return 'repos/' + s.repo + '/contents/' + encPath(s.base + rel); },
	async readAll(progress) {
		const s = cache.source; const out = { orgs: [], people: [] }; const todo = [];
		for (const e of await this.tree(s.repo, s.branch)) {
			if (e.type !== 'blob' || !e.path.startsWith(s.base)) continue;
			const rel = e.path.slice(s.base.length); const m = rel.match(/^(Organizations|People)\/([^/]+)\.md$/i);
			if (!m) continue;
			const kind = m[1] === 'Organizations' ? 'orgs' : 'people';
			const prev = cache[kind][rel];
			// Only download notes whose contents changed since the last read.
			if (prev && prev.sha === e.sha) out[kind].push(prev); else todo.push([kind, rel, m[2], e.sha, prev]);
		}
		const total = todo.length; let n = 0; progress(0, total);
		const worker = async () => {
			while (todo.length) {
				const [kind, rel, title, sha, prev] = todo.shift();
				const text = b64dec((await this.api('repos/' + s.repo + '/git/blobs/' + sha)).content);
				out[kind].push({ key: rel, title, fm: frontmatter(text), modified: prev ? prev.modified : '', sha, link: this.link(rel) });
				n++; if (n % 10 === 0 || n === total) progress(n, total);
			}
		};
		await Promise.all(Array.from({ length: 6 }, worker));
		return out;
	},
	canWrite() { return Boolean(cache.source && cache.source.kind === 'github' && this.token()); },
	async edit(key, fn) {
		const s = cache.source; const f = await this.api(this.contents(key) + '?ref=' + encodeURIComponent(s.branch));
		const next = fn(b64dec(f.content));
		const r = await this.api(this.contents(key), { method: 'PUT', body: JSON.stringify({ message: 'Update ' + key.replace(/^.*\//, '').replace(/\.md$/i, '') + ' (Baypath Sponsors app)', content: b64enc(next), sha: f.sha, branch: s.branch }) });
		return { fm: frontmatter(next), modified: r.commit.committer.date, sha: r.content.sha };
	},
	async create(name, content) {
		const s = cache.source; const key = 'Organizations/' + name + '.md';
		let exists = true;
		try { await this.api(this.contents(key) + '?ref=' + encodeURIComponent(s.branch)); } catch (e) { if (e.status === 404) exists = false; else throw e; }
		if (exists) throw new Error('A note named "' + name + '" already exists.');
		const r = await this.api(this.contents(key), { method: 'PUT', body: JSON.stringify({ message: 'Add ' + name + ' (Baypath Sponsors app)', content: b64enc(content), branch: s.branch }) });
		return { key, modified: r.commit.committer.date, link: this.link(key), sha: r.content.sha };
	}
};

function src() { const k = cache.source && cache.source.kind; return k === 'drive' ? Drive : k === 'github' ? GitHub : (k === 'local' || k === 'local-readonly') ? Local : null; }
function canWrite() { const s = src(); return Boolean(s && s.canWrite()); }

/* ================================================================
 * Reading and writing
 * ================================================================ */
let state = 'idle'; // idle | loading | ready | error | needs-permission
let errorMsg = '';
let progress = null;

async function refresh(ask) {
	if (state === 'loading') return;
	const s = src();
	if (!s) { state = 'idle'; renderAll(); return; }
	if (cache.source.kind === 'local-readonly' && !Local.files) { $('#dirpick').click(); return; }
	try {
		state = 'loading'; errorMsg = ''; progress = { n: 0, total: 0 }; renderAll();
		if (s === Local && !Local.files && !Local.orgDir) {
			const ok = await Local.reconnect(ask);
			if (!ok) { state = 'needs-permission'; renderAll(); return; }
		}
		if (s === Drive) await Drive.signIn(true);
		const data = await s.readAll((n, total) => { progress = { n, total }; renderSync(); const bar = $('#prog'); if (bar) bar.style.width = (total ? Math.round(n / total * 100) : 0) + '%'; });
		cache.orgs = {}; cache.people = {};
		data.orgs.forEach((r) => { cache.orgs[r.key] = r; });
		data.people.forEach((r) => { cache.people[r.key] = r; });
		cache.readAt = new Date().toISOString();
		store.set('cache', cache);
		state = 'ready';
	} catch (e) {
		state = 'error'; errorMsg = e && e.name === 'AbortError' ? 'Folder choice was cancelled.' : (e && e.message) || String(e);
	}
	progress = null;
	rebuild();
}

async function updateOrg(o, set, logType, logText) {
	if (!canWrite()) { toast(cache.source && cache.source.kind === 'local-readonly' ? 'Read-only folder. Open with Chrome or Edge on a computer, or connect the GitHub repository, to edit.' : 'Connect your notes first.'); return; }
	try {
		const res = await src().edit(o.key, (text) => { let t = setYamlKeys(text, set); if (logType) t = appendLog(t, logType, logText || '(no notes)'); return t; });
		const rec = cache.orgs[o.key]; rec.fm = res.fm; rec.modified = res.modified; if (res.sha) rec.sha = res.sha;
		store.set('cache', cache); rebuild(); toast('Saved to ' + o.name + '.md');
	} catch (e) { toast('Not saved: ' + ((e && e.message) || e)); }
}
async function createOrg(name, set) {
	if (!canWrite()) { toast('Connect a folder you can edit first.'); return; }
	try {
		const content = setYamlKeys(newOrgNote(name), set);
		const r = await src().create(name, content);
		cache.orgs[r.key] = { key: r.key, title: name, fm: frontmatter(content), modified: r.modified, link: r.link || '', sha: r.sha };
		store.set('cache', cache); rebuild(); ui.open = name; renderSheet(); toast('Created ' + name + '.md');
	} catch (e) { toast('Not created: ' + ((e && e.message) || e)); }
}

 * Model (same rules as the Obsidian plugin)

const STAGES = [
	{ id: 'identify', label: 'Identify', hint: 'Spotted as a possible fit', action: 'Confirm the basics: headquarters, local presence, and giving program.' },

const OTHER = [{ id: 'paused', label: 'Paused' }, { id: 'not-a-fit', label: 'Not a fit' }, { id: 'unscreened', label: 'Unscreened' }];
const ACTIVE = ['qualify', 'connect', 'cultivate', 'ask'];
const LANES = { new: 'New', lapsed: 'Lapsed', current: 'Current' };
const NE = ['MA', 'RI', 'NH', 'VT', 'ME', 'CT'];

function setStage(o, stage) {
	const set = { funnel_stage: stage };
	if (stage === 'committed' || stage === 'steward') set.engagement = 'current';
	if (stage === 'ask' && !isDate(str(o.fm.last_ask))) set.last_ask = today();
	updateOrg(o, set, 'Stage', 'Moved to ' + stageLabel(stage) + '.');
}

document.addEventListener('click', async (e) => {
	const t = e.target.closest('button, [data-open], [data-person]'); if (!t) return;
	const d = t.dataset;
	if (d.go) { location.hash = d.go; return; }
	if (d.stage) { ui.stage = ui.stage === d.stage ? 'all' : d.stage; if (ui.view !== 'pipeline') location.hash = 'pipeline'; else renderView(); return; }
	if (d.advance) { e.stopPropagation(); const o = M.byName.get(d.advance.toLowerCase()); const ns = o && nextStage(o.stage); if (ns) setStage(o, ns); return; }
	if (d.log) { e.stopPropagation(); ui.open = d.log; ui.person = null; renderSheet(); setTimeout(() => { const x = $('#lg-text'); if (x) { x.scrollIntoView({ block: 'center' }); x.focus(); } }, 50); return; }
	if (d.setstage) { const o = M.byName.get(String(ui.open).toLowerCase()); if (o && o.stage !== d.setstage) setStage(o, d.setstage); return; }
	if (d.person) { e.preventDefault(); ui.person = d.person; ui.open = null; renderPersonSheet(); $('#sheet').scrollTop = 0; return; }
	if (d.open) { ui.open = d.open; ui.person = null; ui.showAllWarm = false; renderSheet(); $('#sheet').scrollTop = 0; return; }
	if (d.driveroot) {
		try { renderDrivePicker(null, '', true); await Drive.useRoot(d.driveroot, d.label); store.set('cache', cache); closeSheet(); refresh(true); }
		catch (err) { renderDrivePicker(null, '', false, err.message); }
		return;
	}
	const o = ui.open && M && M.byName.get(String(ui.open).toLowerCase());
	switch (d.act) {
		case 'close': closeSheet(); break;
		case 'refresh': refresh(true); break;
		case 'regrant': refresh(true); break;
		case 'changesource': location.hash = 'prefs'; break;
		case 'picklocal':
			try { await Local.pick(); cache.orgs = {}; cache.people = {}; store.set('cache', cache); location.hash = 'focus'; await refresh(false); }
			catch (err) { if (err && err.name !== 'AbortError') { state = 'error'; errorMsg = err.message; renderAll(); } }
			break;
		case 'pickbasic': $('#dirpick').click(); break;
		case 'ghconnect':
			try { if (await GitHub.connect()) { store.set('cache', cache); location.hash = 'focus'; await refresh(false); } }
			catch (err) { state = 'error'; errorMsg = (err && err.message) || String(err); renderAll(); }
			break;
		case 'ghforget': store.set('ghToken', ''); renderView(); toast('Token removed from this device'); break;
		case 'drivepick':
			try { await Drive.signIn(true); renderDrivePicker(null, 'Obsidian', true); const r = await Drive.searchFolders('Obsidian'); renderDrivePicker(r, 'Obsidian', false); }
			catch (err) { renderDrivePicker(null, 'Obsidian', false, err.message); }
			break;
		case 'drivesearch': { const q = $('#dq').value.trim(); renderDrivePicker(null, q, true); try { renderDrivePicker(await Drive.searchFolders(q), q, false); } catch (err) { renderDrivePicker(null, q, false, err.message); } break; }
		case 'add': ui.open = null; ui.person = null; renderAddSheet(); break;
		case 'morepeople': ui.showAllPeople = true; renderView(); break;
		case 'allwarm': ui.showAllWarm = true; renderSheet(); break;
		case 'resetprefs': ['focusSize', 'maxCurrentShare', 'maxPerNetwork', 'currentDamping', 'askCooldownMonths', 'localTowns'].forEach((k) => { cfg[k] = DEFAULTS[k]; }); store.set('cfg', cfg); rebuild(); toast('Ranking settings reset'); break;
		case 'forget': cache = { source: null, readAt: null, orgs: {}, people: {} }; store.set('cache', cache); await idb.del('root'); Local.root = Local.orgDir = Local.peopleDir = Local.files = null; Drive.token = null; state = 'idle'; rebuild(); toast('Disconnected'); break;
		case 'savestep': if (o) { const text = $('#ns-text').value.trim(); const date = $('#ns-date').value; updateOrg(o, { next_step: text, next_step_date: date || '' }, 'Next step', text ? 'Next step: ' + text + (date ? ' (' + date + ')' : '') : 'Next step cleared.'); } break;
		case 'savelog':
			if (o) {
				const type = $('#lg-type').value; const text = $('#lg-text').value.trim(); const amount = $('#lg-amt').value.trim();
				const set = { last_touch: today() }; let stage = null;
				if (type === 'Gift received') { set.last_gift = today(); set.engagement = 'current'; if (amount) set.last_gift_amount = amount; stage = 'committed'; set.next_step = 'Thank them within 48 hours and share what the gift will fund'; set.next_step_date = addDays(today(), 2); }
				if (type === 'Application or proposal') { set.last_ask = today(); if (o.stage !== 'ask') stage = 'ask'; }
				if (stage) set.funnel_stage = stage;
				$('#lg-text').value = ''; $('#lg-amt').value = '';
				updateOrg(o, set, type, (text || '(no notes)') + (amount ? ' Amount: ' + amount + '.' : '') + (stage ? ' Stage → ' + stageLabel(stage) + '.' : ''));
			}
			break;
		case 'createprospect': {
			const v = (id) => ($('#' + id).value || '').trim();
			const name = v('ap-name').replace(/[\\/:*?"<>|#^[\]]/g, '').trim();
			if (!name) { toast('Add a company name'); break; }
			if (M && M.byName.has(name.toLowerCase())) { toast('“' + name + '” is already in your notes'); break; }
			const list = (s) => s.split(';').map((x) => x.trim()).filter(Boolean);
			const set = { industry: v('ap-industry'), hq: v('ap-hq'), website: v('ap-web'), baypath_fit: (v('ap-stake') || v('ap-program')) ? 'high' : 'medium', local_ties: list(v('ap-ties')), animal_stake: v('ap-stake'), shelter_program: v('ap-program'), program_fit: v('ap-fit'), warm_paths: list(v('ap-warm')) };
			createOrg(name, set); break;
		}
	}
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); if (e.key === 'Enter' && e.target.id === 'dq') $('[data-act=drivesearch]').click(); });
document.addEventListener('input', (e) => { if (e.target.id === 'q') { ui.q = e.target.value; clearTimeout(window.qT); window.qT = setTimeout(() => { const pos = e.target.selectionStart; renderView(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }, 180); } });
document.addEventListener('change', (e) => {
	const id = e.target.id;
	if (id === 'f-stage') { ui.stage = e.target.value; renderView(); }
	else if (id === 'f-lane') { ui.lane = e.target.value; renderView(); }
	else if (id === 'f-signal') { ui.signal = e.target.value; renderView(); }
	else if (id === 'f-sort') { ui.sort = e.target.value; renderView(); }
	else if (id === 'lg-type') ui.logType = e.target.value;
	else if (id === 'dirpick') {
		try { Local.fromFileList(e.target.files); store.set('cache', cache); location.hash = 'focus'; refresh(false); }
		catch (err) { state = 'error'; errorMsg = err.message; renderAll(); }
		e.target.value = '';
	}
	else if (id === 'p-ghToken') {
		const t = e.target.value.trim(); if (!t) return;
		store.set('ghToken', t); e.target.value = ''; renderView(); toast('Token saved on this device');
	}
	else if (e.target.dataset.pref) {
		const k = e.target.dataset.pref; const raw = e.target.value;
		cfg[k] = typeof DEFAULTS[k] === 'number' ? (Number(raw) || DEFAULTS[k]) : raw.trim();
		store.set('cfg', cfg); M = Object.keys(cache.orgs).length ? buildModel() : null; renderSync(); toast('Saved');
		if (k === 'googleClientId' || k === 'ghRepo') renderView();
	}
});
$('#refresh').addEventListener('click', () => { if (cache.source) refresh(true); else { location.hash = 'prefs'; } });
const VIEWS = ['focus', 'pipeline', 'people', 'balance', 'prefs'];
function route() { const h = location.hash.replace('#', ''); ui.view = VIEWS.includes(h) ? h : 'focus'; if (!$('#sheet').hidden) closeSheet(); renderAll(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);

/* ================================================================
 * Start: show the saved copy at once, then re-read the source.
 * ================================================================ */
route();
rebuild();
(async () => {
	const k = cache.source && cache.source.kind;
	if (k === 'local') {
		const ok = await Local.reconnect(false).catch(() => false);
		if (ok) refresh(false); else { state = 'needs-permission'; renderAll(); }
	} else if (k === 'local-readonly') {
		state = 'ready'; renderAll(); // the basic chooser cannot reopen a folder by itself; Refresh asks again
	} else if (k === 'github') {
		if (GitHub.token()) refresh(false); else { state = 'ready'; renderAll(); toast('Add your GitHub access token in Settings to sync'); }
	} else if (k === 'drive') {
		state = 'ready'; renderAll(); // Google sign-in needs a tap; Refresh signs in and re-reads
		if (cache.readAt && Date.now() - new Date(cache.readAt).getTime() > 3600000) toast('Tap refresh to sync with Google Drive');
	}
})();
</script>
</body>
</html>
